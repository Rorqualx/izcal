# CS-D3 spike: the V8-free half of the token-cell design (ScriptToken, TokenCell,
# lend/reenter state machine, a DOM-like model with insertBefore). No V8 here,
# so Miri can run the unit tests. The V8 half is ../token-cell-v8.
[package]
name = "token-cell"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dev-dependencies]
trybuild = "=1.0.110"

[profile.release]
debug = 1

[workspace]
