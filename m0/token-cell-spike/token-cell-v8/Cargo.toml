# CS-D3 spike, V8 half: hg_script-style token-taking wrappers over the fork's
# rusty_v8, the generated-callback prologue, a MemberCell sketch (criterion 3),
# the scope-as-token and GcCell hole demonstrations, and a clippy
# disallowed-methods check (criterion 2). Built against the prebuilt fork
# archive: source ../../scripts/consume-release.sh first (no V8 build).
[package]
name = "token-cell-v8"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[features]
# Code that calls script-running rusty_v8 methods directly; exists only so
# `cargo clippy --features misuse` can show disallowed-methods firing.
misuse = []
# The deliberately unsound scope-as-token demonstration (`src/holes.rs`).
holes = []

[dependencies]
v8 = { version = "=152.2.0", features = ["v8_enable_sandbox"] }
token-cell = { path = "../token-cell" }

[dev-dependencies]
trybuild = "=1.0.110"

[patch.crates-io]
v8 = { path = "../../rusty_v8" }

[workspace]
