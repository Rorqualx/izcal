# The upstream cppgc patch's API, compiled natively inside the hgba fork's V8
# build (no v8-cppgc-ext shim). Test file copied from
# v8-cppgc-ext/upstream/verify/tests/upstream_api.rs minus the shim import.
[package]
name = "fork-api-verify"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
v8 = { version = "=152.2.0", features = ["v8_enable_sandbox"] }

[patch.crates-io]
v8 = { path = "../rusty_v8" }

[workspace]
