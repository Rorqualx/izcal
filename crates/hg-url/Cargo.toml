[package]
name = "hg-url"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Izcal's URL Standard implementation (L2s, tier P, G31): the browser's one URL parser and serializer, over hg-unicode's UTS 46 and hg-encoding's query encoding"

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
hg-encoding = { path = "../hg-encoding" }
hg-unicode = { path = "../hg-unicode" }

[lints.rust]
# G5: no unsafe at all. Parsing a URL is a state machine over code
# points; every table lookup is a checked one.
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

# Tier P (coding standard A.2): the network services and the broker link
# this crate, so it may never panic (G24).
[lints.clippy]
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
arithmetic_side_effects = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_lossless = "deny"
checked_conversions = "deny"
wildcard_enum_match_arm = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
map_err_ignore = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
allow_attributes = "deny"
