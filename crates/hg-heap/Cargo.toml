[package]
name = "hg-heap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Izcal's JS engine heap (L2e, tier R, JS spec 6.1 and 6.5): the per-process cage, branded mutators and roots, and the precise mark-region collector"

[dependencies]
hg-substrate = { path = "../hg-substrate" }
hg-types = { path = "../hg-types" }

[lints.rust]
# G5: deny, not forbid, so the inventoried `cage` module can #[expect] it.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
# Kani runs `cargo kani`, which sets cfg(kani) (VER-1 harnesses).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"
