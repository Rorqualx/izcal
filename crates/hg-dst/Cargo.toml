[package]
name = "hg-dst"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Izcal's deterministic simulation test runner (tier T): one seed per child process, crash signatures, replay commands, and the same-seed-same-trace check (Stage 1 design 7.4; CS-ER-2, CS-T5)"

[dependencies]
hg-substrate = { path = "../hg-substrate" }
hg-substrate-os = { path = "../hg-substrate-os" }
hg-substrate-sim = { path = "../hg-substrate-sim" }
hg-types = { path = "../hg-types" }

[[bin]]
name = "hg-dst"
path = "src/main.rs"

[[bin]]
name = "dst-smoke"
path = "src/bin/dst-smoke.rs"

[[test]]
name = "it"
path = "tests/it/main.rs"

# Tier T: the base table (coding standard A.1) with A.2's tier T changes.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"
unwrap_used = "allow"
todo = "allow"
print_stdout = "allow"
print_stderr = "allow"
dbg_macro = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
disallowed_macros = "allow"
