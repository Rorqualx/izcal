[package]
name = "hg-reftest-raster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Izcal's minimal CPU rasterizer for reftests (tools, tier T, LY-M0): fills fragment rectangles into a coverage buffer and compares two, until the graphics spec's raster runs; never ships"

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
hg-types = { path = "../hg-types" }

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"
unwrap_used = "allow"
todo = "allow"
print_stdout = "allow"
print_stderr = "allow"
dbg_macro = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
disallowed_macros = "allow"
