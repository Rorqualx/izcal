[package]
name = "hg-substrate-os"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Izcal's OS substrate (tier O, G3): the one crate allowed ambient OS effects — sandbox backends, process kinds, the sanctioned thread interface, IPC endpoints"

# The workspace table, written out because Cargo rejects mixing
# `workspace = true` with a crate-level `check-cfg`. Keep it in step with
# the root `[workspace.lints]` until `cargo xtask lints` generates the
# tier O table (coding standard CS-ST-10).
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
# Kani runs `cargo kani`, which sets cfg(kani) (VER-1 harnesses in
# `ipc::unix`).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"

[dependencies]
hg-launch-plan = { path = "../hg-launch-plan" }
hg-substrate = { path = "../hg-substrate" }
hg-types = { path = "../hg-types" }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Isolation",
  "Win32_System_Threading",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_JobObjects",
  "Win32_Storage_FileSystem",
  "Win32_System_ProcessStatus",
  "Win32_System_Environment",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_Security_Cryptography",
  "Win32_Security_Authorization",
  "Wdk_Foundation",
] }

[[test]]
name = "it"
path = "tests/it/main.rs"

[[bin]]
name = "fp-m0-empty"
path = "src/bin/fp-m0-empty.rs"

[[bin]]
name = "fp-m0-probe"
path = "src/bin/fp-m0-probe.rs"

[[bin]]
name = "hg-spawner-main"
path = "src/bin/hg-spawner-main.rs"

[[bin]]
name = "hg-launch-probe"
path = "src/bin/hg-launch-probe.rs"
test = false

[[bin]]
name = "substrate-idle"
path = "src/bin/substrate-idle.rs"
