[package]
name = "hg-substrate-os"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Izcal's OS substrate (tier O, G3): the one crate allowed ambient OS effects — sandbox backends, process kinds, the sanctioned thread interface, IPC endpoints"

[lints]
workspace = true

[dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Isolation",
  "Win32_System_Threading",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_JobObjects",
  "Win32_Storage_FileSystem",
  "Win32_System_ProcessStatus",
  "Win32_System_Environment",
] }

[[bin]]
name = "fp-m0-empty"
path = "src/bin/fp-m0-empty.rs"

[[bin]]
name = "fp-m0-probe"
path = "src/bin/fp-m0-probe.rs"
