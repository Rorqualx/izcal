[package]
name = "hg-raster-ref"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Izcal's reference rasterizer (tier T, graphics spec 6.4, GR-M0): exact coverage by rational polygon clipping, slow on purpose, so hg-raster has something to be wrong against"

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
hg-display-list = { path = "../hg-display-list" }
hg-raster = { path = "../hg-raster" }

# Tier T: the base table (coding standard A.1) with A.2's tier T
# changes, and the arithmetic denies kept. An oracle that wrapped
# silently would make every comparison against it meaningless.
[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

# Tier P additions (coding standard A.2); written by hand until
# `cargo xtask lints` generates them from tools/lints.toml.
[lints.clippy]
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
arithmetic_side_effects = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_lossless = "deny"
checked_conversions = "deny"
wildcard_enum_match_arm = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
map_err_ignore = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
allow_attributes = "deny"

