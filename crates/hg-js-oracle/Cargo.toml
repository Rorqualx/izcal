[package]
name = "hg-js-oracle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Izcal's JS oracles (tier T, never shipped): the operation-level oracle, which checks each core operation of the reference interpreter against engine262 run black-box under Node (JS-M0, ORC-1)"

[dependencies]
hg-heap = { path = "../hg-heap" }
hg-js-bytecode = { path = "../hg-js-bytecode" }
hg-js-ops = { path = "../hg-js-ops" }
hg-js-runtime = { path = "../hg-js-runtime" }
hg-substrate = { path = "../hg-substrate" }
hg-substrate-os = { path = "../hg-substrate-os" }

# Tier T: the base table (coding standard A.1) with A.2's tier T changes.
[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"
unwrap_used = "allow"
todo = "allow"
print_stdout = "allow"
print_stderr = "allow"
dbg_macro = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
disallowed_macros = "allow"
