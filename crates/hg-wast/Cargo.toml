[package]
name = "hg-wast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Izcal's WebAssembly script runner (tier T): the .wast token grammar, the script commands and their value and result patterns, read from the spec suite (JS engine spec, tools: hg-wast; ORC-1)"

# No dependencies. The script grammar is read from the specification's
# prose (text format, "Lexical Format" and "Scripts"), not from another
# parser's code (HGBA-2 M-1 part 3), and nothing here decodes or runs
# WebAssembly: an engine does that, behind the adapter hg-wast drives.

[[bin]]
name = "hg-wast"
path = "src/main.rs"

[[test]]
name = "it"
path = "tests/it/main.rs"

# Tier T: the base table (coding standard A.1) with A.2's tier T changes.
# unsafe_code is forbid, not deny: the crate is not in the inventory (G5).
[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"
unwrap_used = "allow"
todo = "allow"
print_stdout = "allow"
print_stderr = "allow"
dbg_macro = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
disallowed_macros = "allow"
