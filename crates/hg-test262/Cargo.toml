[package]
name = "hg-test262"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Izcal's test262 conformance runner (tier T): front matter, strictness expansion, the $262 host contract through an engine adapter, result ledgers by directory and feature (JS engine spec, tools: hg-test262; ORC-1)"

# No dependencies. The runner reads test262's YAML front matter subset,
# its ledgers and tools/test-data.toml with its own small readers; nothing
# that parses or runs JavaScript comes from a library. The engine under
# test runs in a child process behind the `Engine` trait.

[[bin]]
name = "hg-test262"
path = "src/main.rs"

[[test]]
name = "it"
path = "tests/it/main.rs"

# Tier T: the base table (coding standard A.1) with A.2's tier T changes.
# unsafe_code is forbid, not deny: the crate is not in the inventory (G5).
[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"
unwrap_used = "allow"
todo = "allow"
print_stdout = "allow"
print_stderr = "allow"
dbg_macro = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
disallowed_macros = "allow"
