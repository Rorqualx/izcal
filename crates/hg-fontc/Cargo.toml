[package]
name = "hg-fontc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Izcal's font compiler (tier T, fonts and text 6.15, TX-D24, TX-M0): the table writers hg-fontgen generates from the same .hgfont descriptions hg-fontfmt reads, so every output round-trips through the proved reader"

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
hg-fontfmt = { path = "../hg-fontfmt" }

# Tier T: the base table (coding standard A.1) with A.2's tier T changes.
# unsafe_code is forbid, not deny: the crate is not in the inventory (G5).
#
# The arithmetic and indexing denies of tier R are kept, against the tier
# T relaxation: what this crate writes becomes a shipped font (TX-D24),
# and a count that wraps here is a malformed table that the reader would
# then have to decline. A compiler that cannot be trusted to compute a
# length is of no use to a type designer.
[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_lossless = "deny"
wildcard_enum_match_arm = "deny"
panic = "deny"
unreachable = "deny"
unwrap_used = "deny"
expect_used = "deny"
map_err_ignore = "deny"
allow_attributes = "deny"
todo = "allow"
print_stdout = "allow"
print_stderr = "allow"
dbg_macro = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
disallowed_macros = "allow"
