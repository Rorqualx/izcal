[package]
name = "hg-layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Izcal's layout contract (L4, tier R, LY-D1): the constraint space as the complete input, break tokens, layout results, and the one central relayout diff"

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
hg-types = { path = "../hg-types" }
hg-fragment = { path = "../hg-fragment" }
hg-layout-num = { path = "../hg-layout-num" }

[lints.rust]
# G40: every crate of the layout spec is forbid(unsafe_code) with no
# inventory entry.
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

# Tier R (coding standard A.2).
[lints.clippy]
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
arithmetic_side_effects = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
wildcard_enum_match_arm = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
map_err_ignore = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
allow_attributes = "deny"
