[package]
name = "hg-paint-order"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Izcal's paint-order contract (L4, tier R, LY 6.14): CSS 2.1 Appendix E's stacking and painting order as a reference builder; the production implementation is the graphics spec's (GR 6.24)"

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
hg-types = { path = "../hg-types" }

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"
unwrap_used = "allow"
todo = "allow"
print_stdout = "allow"
print_stderr = "allow"
dbg_macro = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
disallowed_macros = "allow"
