[package]
name = "hg-net-main"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The network service executable (L6, tier P, review M5): os_child_substrate, then hg-net-service's run for the kind it was launched as (Stage 1 S1-M1b; E-R1)"

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
hg-net-service = { path = "../hg-net-service" }
hg-substrate-os = { path = "../hg-substrate-os" }

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
# Kani runs `cargo kani`, which sets cfg(kani) (VER-1 harnesses).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

# Tier P additions (coding standard A.2); written by hand until
# `cargo xtask lints` generates them from tools/lints.toml.
[lints.clippy]
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
arithmetic_side_effects = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_lossless = "deny"
checked_conversions = "deny"
wildcard_enum_match_arm = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
map_err_ignore = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
allow_attributes = "deny"
