[package]
name = "hg-launch-tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Izcal's launch tool (tier T): the M1 exit's OS round trip and FP-27's spawn-to-ready runs (E-R12, review minor: --measure-spawn lives here, never in a main)"

[dependencies]
hg-browser = { path = "../hg-browser" }
hg-renderer = { path = "../hg-renderer" }
hg-substrate = { path = "../hg-substrate" }
hg-substrate-os = { path = "../hg-substrate-os" }
hg-types = { path = "../hg-types" }

[features]
# M1 phase G's Windows FP-27 breakdown: `measure-phases N` and the
# substrate's launch stamps. Measurement builds only.
measure-launch = ["hg-substrate-os/measure-launch"]

[[test]]
name = "it"
path = "tests/it/main.rs"

# Tier T: the base table (coding standard A.1) with A.2's tier T changes.
[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"
unwrap_used = "allow"
todo = "allow"
print_stdout = "allow"
print_stderr = "allow"
dbg_macro = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
disallowed_macros = "allow"
