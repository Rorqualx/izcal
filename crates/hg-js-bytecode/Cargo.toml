[package]
name = "hg-js-bytecode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Izcal's JS bytecode format (L2e, tier R; JS spec 6.3, design review R0-B1 to R0-B11): the opcode table generated by hg-opgen, the decoder, the text assembler and disassembler, and the bytecode unit's image and trusted forms"

[dependencies]
hg-heap = { path = "../hg-heap" }
hg-js-number = { path = "../hg-js-number" }

[dev-dependencies]
hg-heap = { path = "../hg-heap", features = ["testing"] }

[lints]
workspace = true
