[package]
name = "hg-dst-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Izcal's simulation binaries (tier T): the only package besides hg-replay-main that links hg-substrate-sim (Q-CS-1), run by hg-dst; dst-smoke and the M1 process skeletons under faults (dst-sim)"

[dependencies]
hg-browser = { path = "../hg-browser" }
hg-ipc = { path = "../hg-ipc" }
hg-ipc-gen = { path = "../hg-ipc-gen" }
hg-net-service = { path = "../hg-net-service" }
hg-renderer = { path = "../hg-renderer" }
hg-substrate = { path = "../hg-substrate" }
hg-substrate-os = { path = "../hg-substrate-os" }
hg-substrate-sim = { path = "../hg-substrate-sim" }
hg-types = { path = "../hg-types" }

[dev-dependencies]
hg-build-id = { path = "../hg-build-id" }
hg-dst = { path = "../hg-dst" }

[[bin]]
name = "dst-smoke"
path = "src/bin/dst-smoke.rs"

[[bin]]
name = "dst-sim"
path = "src/bin/dst-sim.rs"

[[test]]
name = "it"
path = "tests/it/main.rs"

# Tier T: the base table (coding standard A.1) with A.2's tier T changes.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"
unwrap_used = "allow"
todo = "allow"
print_stdout = "allow"
print_stderr = "allow"
dbg_macro = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
disallowed_macros = "allow"
