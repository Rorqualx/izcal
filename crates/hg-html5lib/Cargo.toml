[package]
name = "hg-html5lib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Izcal's html5lib-tests tokenizer runner (tier T, style spec ST-1, ST-M0): runs the pinned suite against both generated back ends and reports the number it measures"

[[bin]]
name = "hg-html5lib"
path = "src/main.rs"

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
hg-htmlgen = { path = "../hg-htmlgen" }
hg-html-syntax = { path = "../hg-html-syntax", features = ["conformance"] }

# Tier T: the base table (coding standard A.1) with A.2's tier T changes.
# unsafe_code is forbid, not deny: the crate is not in the inventory (G5).
[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"
unwrap_used = "allow"
todo = "allow"
print_stdout = "allow"
print_stderr = "allow"
dbg_macro = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
disallowed_macros = "allow"
