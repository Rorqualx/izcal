[package]
name = "hg-layout-num"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Izcal's layout numeric boundary (L4, tier R, LY-D3, G39): the one conversion from style's IEEE values to fixed point, i128 ratio arithmetic, and the one rounding function to LayoutUnit"

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
hg-types = { path = "../hg-types" }

[lints.rust]
# G5: no unsafe. Every operation is integer arithmetic over a checked
# range.
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

# Tier R (coding standard A.2).
[lints.clippy]
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
arithmetic_side_effects = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
wildcard_enum_match_arm = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
map_err_ignore = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
allow_attributes = "deny"
