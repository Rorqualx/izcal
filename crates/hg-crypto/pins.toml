# hg-crypto's primitives: where each comes from, and under what licence.
#
# NW-M0 asks for "hg-crypto's interfaces with every pin resolved and
# licence-checked". This file is that resolution, and `tests/it/pins.rs`
# is the check: every primitive the crate's interfaces name has a row,
# every row names a licence HGBA-2 2.3.2 allows (MIT, or MIT among a
# dual licence), and every row says whether the code exists yet.
#
# `source = "izcal"` means Izcal writes it from the published standard
# and the licence is Izcal's own MIT. The owner confirmed on 19 October
# 2026 that Izcal writes P-256, P-384 and RSA verification itself
# (NW-D23).
#
# `source = "pinned"` means a RustCrypto crate behind Izcal's
# interface. A pin is resolved here and the dependency is added with
# the primitive, not before: a crate in Cargo.toml that nothing calls
# is a licence obligation and an attack surface for nothing in return.
#
# `status`:
#   built    -- the code is in this crate and its vectors run in CI
#   pinned   -- the source and licence are decided, the code is not here
#
# Every `pinned` row is NW-M1's, and none of them may merge until
# `hg-crypto-check` passes on it for every target ISA (G36, NW-50).

[[primitive]]
name = "sha-256"
kind = "hash"
standard = "FIPS 180-4"
source = "izcal"
licence = "MIT"
status = "built"
why = "TLS 1.3's key schedule is HKDF over one hash (RFC 8446 7.1), so this is the floor of hg-tls. Written from the standard's own constants and formulas."

[[primitive]]
name = "sha-384"
kind = "hash"
standard = "FIPS 180-4"
source = "izcal"
licence = "MIT"
status = "pinned"
why = "The other hash TLS 1.3's cipher suites use. Same construction as SHA-256 over 64-bit words."

[[primitive]]
name = "hmac"
kind = "mac"
standard = "RFC 2104, FIPS 198-1"
source = "izcal"
licence = "MIT"
status = "built"
why = "Generic over the hash. Verification compares in constant time, which is the part a functional test cannot check."

[[primitive]]
name = "hkdf"
kind = "kdf"
standard = "RFC 5869, RFC 8446 7.1"
source = "izcal"
licence = "MIT"
status = "built"
why = "Extract and expand, with TLS 1.3's HKDF-Expand-Label over them."

[[primitive]]
name = "aes-gcm"
kind = "aead"
standard = "NIST SP 800-38D, RFC 5116"
source = "pinned"
crate = "aes-gcm"
licence = "MIT OR Apache-2.0"
status = "pinned"
why = "A table-driven AES is a cache-timing leak and a constant-time one needs per-ISA intrinsics; this is the clearest case for a pinned implementation behind Izcal's interface. NW-50 gates it per ISA all the same."

[[primitive]]
name = "chacha20-poly1305"
kind = "aead"
standard = "RFC 8439"
source = "pinned"
crate = "chacha20poly1305"
licence = "MIT OR Apache-2.0"
status = "pinned"
why = "The suite for machines without AES instructions. Constant time by construction, which is why it exists."

[[primitive]]
name = "x25519"
kind = "key-agreement"
standard = "RFC 7748"
source = "izcal"
licence = "MIT"
status = "pinned"
why = "NW-D23: Izcal writes it. The curve is designed so that a correct implementation is naturally constant time."

[[primitive]]
name = "p-256"
kind = "key-agreement, signature"
standard = "FIPS 186-5, SEC 1"
source = "izcal"
licence = "MIT"
status = "pinned"
why = "Owner decision, 19 October 2026 (NW-D23): Izcal writes P-256, P-384 and RSA verification itself."

[[primitive]]
name = "p-384"
kind = "key-agreement, signature"
standard = "FIPS 186-5, SEC 1"
source = "izcal"
licence = "MIT"
status = "pinned"
why = "Owner decision, 19 October 2026 (NW-D23). ECDH and ECDSA signing as well as verification."

[[primitive]]
name = "ed25519"
kind = "signature"
standard = "RFC 8032"
source = "izcal"
licence = "MIT"
status = "pinned"
why = "Update and trust-data verification. Izcal's own, for the same reason as X25519."

[[primitive]]
name = "rsa"
kind = "signature"
standard = "RFC 8017"
source = "izcal"
licence = "MIT"
status = "pinned"
why = "Owner decision, 19 October 2026 (NW-D23): verification is Izcal's. Private-key operations are needed for client certificates."

[[primitive]]
name = "ml-kem-768"
kind = "key-agreement"
standard = "FIPS 203"
source = "pinned"
crate = "ml-kem"
licence = "MIT OR Apache-2.0"
status = "pinned"
why = "X25519MLKEM768 is NW-M1's default key share. A lattice KEM is new enough that a published, reviewed implementation is worth more than Izcal's first attempt at one."

[[primitive]]
name = "hpke"
kind = "aead, key-agreement"
standard = "RFC 9180"
source = "izcal"
licence = "MIT"
status = "pinned"
why = "ECH's sealing. It is a composition of the primitives above rather than a primitive of its own, so it is Izcal's."
