[package]
name = "hg-css-props"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Izcal's CSS property table (L2p, tier R, style spec 6.6, ST-D6): generated by hg-cssgen from @webref/css and the .hgprop overlay, which fails to build when the two disagree"

[features]
# The value grammars and the defining URLs. They are large and only
# hg-style-reference and DevTools read them, so a site process does not
# carry them. Off by default; the generated module is behind this.
reference = []

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints.rust]
# G5: no unsafe at all. The crate is a generated table and the
# lookups over it.
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

# Tier R additions (coding standard A.2); written by hand until
# `cargo xtask lints` generates them from tools/lints.toml.
[lints.clippy]
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
arithmetic_side_effects = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_lossless = "deny"
checked_conversions = "deny"
wildcard_enum_match_arm = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
map_err_ignore = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
allow_attributes = "deny"
