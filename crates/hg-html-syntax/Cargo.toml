[package]
name = "hg-html-syntax"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Izcal's HTML tokenizer (L2p, tier R, style spec 6.2, ST-D3, ST-1): generated by hg-htmlgen from the .hgtok descriptions in states/, with the table-driven reference stepper as its oracle"

[features]
# What html5lib-tests needs and a shipping build does not: a tokenizer
# started in any state, with a last start tag already set. The suite
# runs cases from the CDATA section state and names a `lastStartTag`,
# neither of which a tree builder can ask for.
#
# It adds one constructor and changes nothing else, and only
# hg-html5lib and this crate's own tests ask for it. Cargo unifies
# features across a workspace-wide build, so a `cargo build
# --workspace` -- which is a build of the tests -- does compile it in.
# What keeps it out of a shipping binary is that the binary's own
# package does not depend on hg-html5lib, so building that package does
# not enable it.
conformance = []

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints.rust]
# G5: no unsafe at all. The tokenizer is a state machine over chars.
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

# Tier R additions (coding standard A.2); written by hand until
# `cargo xtask lints` generates them from tools/lints.toml.
[lints.clippy]
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
arithmetic_side_effects = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_lossless = "deny"
checked_conversions = "deny"
wildcard_enum_match_arm = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
map_err_ignore = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
allow_attributes = "deny"
