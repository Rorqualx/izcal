[package]
name = "hg-os-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Izcal's OS input and command frames (L2, tier R): the Rust that hg-ipc-codegen writes from idl/os.hgidl, the frames of the broker's OsPort (OS integration 6.1, OI-D1)"

[dependencies]
hg-ipc = { path = "../hg-ipc" }

[dev-dependencies]
hg-ipc-codegen = { path = "../hg-ipc-codegen" }
hg-substrate = { path = "../hg-substrate" }
hg-substrate-os = { path = "../hg-substrate-os" }
hg-substrate-sim = { path = "../hg-substrate-sim" }
hg-types = { path = "../hg-types" }

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
# Kani runs `cargo kani`, which sets cfg(kani) (VER-1 harnesses).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

# Tier P's table, stricter than the crate's tier R, because the generated
# code is written to it (as hg-ipc-gen's is). Tier P additions (coding standard A.2); written by hand until
# `cargo xtask lints` generates them from tools/lints.toml.
[lints.clippy]
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
arithmetic_side_effects = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_lossless = "deny"
checked_conversions = "deny"
wildcard_enum_match_arm = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
map_err_ignore = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
allow_attributes = "deny"

