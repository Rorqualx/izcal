[package]
name = "v8-cppgc-ext"
version = "0.1.0"
edition = "2024"
description = "Safe Rust bindings for cppgc (Oilpan) APIs that rusty_v8 152.2.0 does not expose, via a small C++ shim compiled against the same V8 headers and Chromium libc++."
license = "MIT"
publish = false

[dependencies]
# Pinned exactly: the C++ shim is compiled against this crate's V8 headers and
# must match the ABI of its prebuilt static library.
v8 = "=152.2.0"

[build-dependencies]
cc = "1"

[features]
default = []
# Forwarded to rusty_v8 so the shim's defines follow the prebuilt variant.
v8_enable_pointer_compression = ["v8/v8_enable_pointer_compression"]
v8_enable_sandbox = ["v8/v8_enable_sandbox", "v8_enable_pointer_compression"]

[profile.release]
debug = false
