[package]
name = "cetprobe"
version = "0.0.0"
edition = "2024"
publish = false
description = "JS-M0 Q-JS-15: black-box probes of Windows user-mode shadow stacks (CET)"

[workspace]

[dependencies]
# The repo's locked version (Cargo.lock: windows-sys 0.61.2).
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Performance",
  "Win32_System_Console",
] }

[profile.release]
debug = false
panic = "unwind"
