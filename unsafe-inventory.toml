# CS-TY-13: inventoried unsafe code. Each module here carries
# #[expect(unsafe_code, reason = "G5: <entry>")] and every unsafe block
# states its precondition and why it holds. The graph lint checks these
# module paths against the code (tools/checks.sh, when it gains the
# graph check). Unsafe diffs need the inventory owner (CODEOWNERS).

[crates.hg-substrate-os]
entries = [
  "sandbox::macos",             # the sandbox API (security scope 6.7's measured path)
  "sandbox::linux",             # seccomp-bpf: prctl FFI and the raw filter program
  "sandbox::windows",           # Win32 token APIs (untrusted integrity, lockdown, job)
  "src/bin/fp-m0-probe.rs",     # posix_spawn + signals: the FP-M0 supervisor
  "src/bin/fp-m0-empty.rs",     # the pre-opened fd 3 (UnixStream::from_raw_fd)
  "os::random",                 # the OS CSPRNG calls (getentropy, getrandom, BCryptGenRandom)
  "os::vm",                     # virtual memory calls (mmap/mprotect/madvise/munmap, VirtualAlloc/VirtualFree)
  "memory",                     # ledger-checked calls into os::vm, and the test's page write
  "ipc::linux::sys",            # the Linux IPC transport's socket, sendmsg/recvmsg (SCM_RIGHTS), epoll and eventfd calls
  "ipc::macos::sys",            # the macOS IPC transport's Mach port and mach_msg calls, posix_spawn with a bootstrap port
  "ipc::windows::sys",          # the Windows IPC transport's named pipes, ReadFileEx/WriteFileEx, DuplicateHandle and child start
  "launch::linux::sys",         # the launch path: clone3 with namespaces and pidfd, Landlock, the launch filter, execveat, pidfd signals, the reaper
  "launch::macos::sys",         # the launch path on macOS: code-directory hashes (Security framework), F_GETPATH
  "src/bin/hg-launch-probe.rs", # the spawner's test child: raw fd, prctl and syscall probes
  "ipc::shm",                   # atomic byte and word access to a mapped shared-memory region (D6)
]

[crates.hg-ipc]
entries = [
  "utf8",                       # from_utf8_unchecked after the safe byte-at-a-time Table 3-7 validator (Kani-checked against core to 6 bytes; 10M-input differential test)
]
