# Izcal crate tiers and layers: the normative file of coding standard 6.2
# and CS-ST-10. hg-graph-lint (tools/checks.sh `graph`) fails when:
#   - a workspace crate has no row here;
#   - a crate's declared tier is laxer than the strictest tier of any
#     binary that links it ("crate X is now linked by Y; declare tier P
#     in its own PR"); O counts as strict as P (6.2: "Panics: as tier P");
#   - a shipping binary (hg-*-main) links a tier T crate;
#   - a crate depends on a higher layer (Stage 1 design 2.1; the order is
#     in tools/graph-rules.toml).
# Tiers: P shared, R per site, O the OS substrate, T tools and tests.
# Layers: Stage 1 2.1's L0-L6 and sub-layers (L2s, L2e, ...), and `tools`.
# A tier change is a gate-file change (CS-GA-1): review by the owner.
#
# Rows exist for today's crates only; the rows the standard's revision
# notes list for crates that do not exist yet arrive with their crates.

[crates.hg-types]
tier = "P"
layer = "L2"
why = "Coding standard 6.2 names hg-types in tier P; Stage 1 2.1 puts it in L2 contracts (geometry, time, ids)"

[crates.hg-substrate]
tier = "P"
layer = "L1"
why = "6.2 names hg-substrate in tier P (every binary links the traits); Stage 1 2.1: L1 substrate (traits)"

[crates.hg-substrate-os]
tier = "O"
layer = "L1"
why = "6.2: tier O is hg-substrate-os only, the one crate allowed ambient OS effects (G3); Stage 1 2.1: L1"

[crates.hg-substrate-sim]
tier = "R"
layer = "L1"
why = "6.2 and 6.3: tier R with G3 wherever it ships (hg-replay-main), Q-CS-1; Stage 1 2.1: L1"

[crates.hg-ipc]
tier = "P"
layer = "L1"
why = "6.2 names hg-ipc in tier P; Stage 1 2.1: L1 (transport)"

[crates.hg-ipc-gen]
tier = "P"
layer = "L2"
why = "6.2 names hg-ipc-gen in tier P; Stage 1 2.1: L2 contracts (generated endpoints)"

[crates.hg-ipc-codegen]
tier = "T"
layer = "tools"
why = "6.2 names hg-ipc-codegen in tier T; Stage 1 2.1: tools"

[crates.hg-dst]
tier = "T"
layer = "tools"
why = "6.2 and 6.3: the hg-dst runner is tier T; Stage 1 2.1: tools. Since M1 phase E it links no simulator: the simulation binaries are hg-dst-sim's (E-R1, C7)"

[crates.hg-dst-sim]
tier = "T"
layer = "tools"
why = "M1 plan E-R1: the simulation binaries (dst-sim, dst-smoke), split out of hg-dst so Q-CS-1 can name them; tools, tier T"

[crates.hg-graph-lint]
tier = "T"
layer = "tools"
why = "6.2 names hg-graph-lint in tier T; Stage 1 2.1: tools"

# --- M1 phase E (plan E-R1 and its design-review dispositions) -------------

[crates.hg-launch-wire]
tier = "P"
layer = "L2s"
why = "OS integration 6.x crate table: L2s, the IZLH codec, tier P with no dependencies (G232)"

[crates.hg-os-types]
tier = "R"
layer = "L2"
why = "OS integration crate table: L2, OsInput/OsCommand/OsRegistration generated from os.hgidl, tier R"

[crates.hg-launch-plan]
tier = "P"
layer = "L1"
why = "M1 plan E-R1 and review B2: the substrate's own launch vocabulary (the spawner's request/reply records and each kind's sandbox plan), with no project dependencies; hg-substrate-os (L1: the spawner and the launchers) and higher layers use it, so no edge goes upward. Stage 1 2.1 does not list the crate yet (C13 amendment, proposed)"

[crates.hg-build-id]
tier = "T"
layer = "tools"
why = "Distribution 13 item 5 (DU-M0a): the tool that computes a build's BuildId before compilation; its own docs: tools layer, tier T"

[crates.hg-browser]
tier = "P"
layer = "L5"
why = "M1 plan E-R1: broker logic, run(Substrate, BrowserConfig); L5, tier P (S1-M1a)"

[crates.hg-renderer]
tier = "R"
layer = "L4"
why = "M1 plan E-R1: renderer logic, run(Substrate, RendererConfig); L4, tier R"

[crates.hg-net-service]
tier = "P"
layer = "L5"
why = "M1 plan E-R1, layer L5; tier P by design-review disposition M5 (the partition-service split stays open)"

[crates.hg-browser-main]
tier = "P"
layer = "L6"
why = "M1 plan E-R1: a shipping main, as its library (hg-browser, P); S1-M1b"

[crates.hg-renderer-main]
tier = "R"
layer = "L6"
why = "M1 plan E-R1: a shipping main, as its library (hg-renderer, R); S1-M1b"

[crates.hg-net-main]
tier = "P"
layer = "L6"
why = "M1 plan E-R1, as its library; tier P by design-review disposition M5"

[crates.hg-launch-tool]
tier = "T"
layer = "tools"
why = "M1 plan E design review (minor, other): --measure-spawn lives in a tool binary, never in a main; also runs the OS round trip (E-R12); tools, tier T"

# --- JS-M0 ------------------------------------------------------------------

[crates.hg-heap]
tier = "R"
layer = "L2e"
why = "JS spec 6.15: hg-heap is L2e, tier R with an inventoried unsafe core (the cage module); its tier-P build for the component host comes with JS-D10"

[crates.hg-opgen]
tier = "T"
layer = "tools"
why = "JS spec 6.3 and G16: the operation generator, a build-time tool that reads the .hgop descriptions and writes checked-in Rust (design review R0-O1 to R0-O12); tools, tier T"

[crates.hg-js-number]
tier = "R"
layer = "L2e"
why = "JS spec 6.13 (Numbers): Number::toString's shortest round trip, StringToNumber and ToInt32/ToUint32, its own crate so hg-js-bytecode can read number literals without depending on hg-js-runtime (owner decision, 4 November 2026; 6.15's table gains the row in the JS-M0 spec amendments); its exponentiation is interim until hg-math, which 6.9 makes the one implementation; built here, no library (HGBA-2 M-1 part 1)"

[crates.hg-js-bytecode]
tier = "R"
layer = "L2e"
why = "JS spec 6.3, bytecode note: the generated opcode table, the decoder, the unit image and its trusted form, the assembler and disassembler; the verifier's tables (JS-M1)"

[crates.hg-js-ops]
tier = "R"
layer = "L2e"
why = "JS spec 6.3, design review R0-O1: the generated reference interpreter, generic over the generated Runtime trait, its frame and value layer over hg-heap, and the operation facts"

[crates.hg-js-runtime]
tier = "R"
layer = "L2e"
why = "JS spec 6.3: the JS-M0 runtime the generated interpreter calls (the agent, jobs, ClearKeptObjects, conversions, properties, finalization cleanup)"

[crates.hg-js-oracle]
tier = "T"
layer = "tools"
why = "JS-M0 plan Phase 1 (ORC-1): the operation-level oracle, which checks each core operation of the reference interpreter against engine262 run black-box under Node; test-only, never shipped; tools, tier T"

[crates.hg-test262]
tier = "T"
layer = "tools"
why = "JS engine spec, crate table: hg-test262, the test262 runner, tools, tier T; ORC-1's oracle, validated at JS-M0 against engine262 run black-box (test-only, never linked)"

[crates.hg-wast]
tier = "T"
layer = "tools"
why = "JS engine spec, crate table: hg-wast, the WebAssembly script runner, tools, tier T; JS-M0 Phase 1 (ORC-1). At JS-M0 it is the script reader, checked against the whole pinned spec suite; the engine adapter and the differential against the reference interpreter follow"

[crates.hg-ucd]
tier = "P"
layer = "L2s"
why = "Fonts and text 9.3, TX-M0: the Unicode Character Database as tables, generated by hg-unicode-build. Tier P and L2s because hg-url's UTS 46 host parsing (style spec ST-15) links it into the network services and the broker."

[crates.hg-unicode]
tier = "P"
layer = "L2s"
why = "Fonts and text 6 and 9.3, TX-M0, TX-1: the Unicode algorithms over hg-ucd. Normalization at TX-M0, for hg-url; bidi, line breaking and segmentation follow. Tier P for the same reason as hg-ucd."

[crates.hg-unicode-build]
tier = "T"
layer = "tools"
why = "Fonts and text 9.3, TX-M0: reads the pinned Unicode Character Database and writes hg-ucd's tables, whose freshness is a test (G16). Never linked; the database is test-only input and is never committed."

[crates.hg-css-props]
tier = "R"
layer = "L2p"
why = "Style spec 6.15 crate table: L2p, tier R, generated. The property table hg-cssgen emits from @webref/css and the .hgprop overlay; a hand edit fails CI (G29), and a disagreement between the overlay and the pinned webref fails the build (ST-D6, ST-7)."

[crates.hg-cssgen]
tier = "T"
layer = "tools"
why = "Style spec 6.15 crate table: tools, tier T, output held to R. The .hgprop overlay language, the cross-check against the pinned @webref/css, and the hg-css-props table it emits (ST-D6)."

[crates.hg-fontfmt]
tier = "R"
layer = "L2t"
why = "Fonts and text 6.15 crate table: L2t, tier R. Generated by hg-fontgen from the .hgfont descriptions (G29); the only hand-written code is its byte readers."

[crates.hg-fontgen]
tier = "T"
layer = "tools"
why = "Fonts and text 6.15 crate table: tools, tier T, output held to R. The .hgfont language and the reader, Kani harnesses, fuzz grammar and anchors it emits (TX-11, G29)."

[crates.hg-html-syntax]
tier = "R"
layer = "L2p"
why = "Style spec 6.15 crate table: L2p, tier R. The tokenizer and (at ST-M1) the tree builder and TreeSink trait; nothing here touches the DOM (G23: only this crate tokenizes HTML). Its generated/ is written by hg-htmlgen from states/*.hgtok and a hand edit fails CI (G29)."

[crates.hg-json]
tier = "T"
layer = "tools"
why = "Izcal's own JSON reader, with no dependencies. Three pinned inputs are JSON — WHATWG's entities.json, html5lib-tests' .test files and @webref/css's css.json — and one reader serves them; nothing here ships, only the tables generated from those inputs do."

[crates.hg-html5lib]
tier = "T"
layer = "tools"
why = "Style spec 6.15 crate table: tools, tier T. The html5lib tokenizer runner, which measures ST-1's tokenizer half against the pinned suite and reports the number it finds."

[crates.hg-htmlgen]
tier = "T"
layer = "tools"
why = "Style spec 6.15 crate table: tools, tier T, output held to R. The .hgtok language and the tokenizer, reference stepper and coverage table it emits (ST-D3)."
