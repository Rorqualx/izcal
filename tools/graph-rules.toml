# Izcal crate-graph rules, as data for hg-graph-lint (tools/checks.sh
# `graph`; Stage 1 design 2.2, coding standard A.6). A rule whose crates
# do not exist yet costs nothing and binds the moment they do. Every key
# is checked: a misspelt key is an error, never a silently dead rule.
#
# "Linked" means reachable through normal dependencies (dev-dependencies
# build only tests; build-dependencies run on the host; a procedural
# macro runs in the compiler). Each rule reads the --all-features graph on
# Linux, macOS and Windows unless it says `features = "default"`.
# This is a gate file (CS-GA-1): an edit here needs the owner's review.

# --- Layers (Stage 1 2.1; CS-ST-2) -----------------------------------------
# A crate depends (normal or build) only on its own or a lower group.
# L0 is external crates, which are not ranked. The L2 sub-layers are one
# group: Stage 1 2.1 orders L1 < L2 < L3 < L4 < L5 < L6 and does not order
# the L2 sub-layers among themselves. Tools sit above everything, so no
# engine crate can depend on a tool.
[layers]
order = [
  ["L0"],
  ["L1"],
  ["L2", "L2s", "L2e", "L2p", "L2t", "L2m", "L2g", "L2d"],
  ["L3", "L3s"],
  ["L4"],
  ["L5"],
  ["L6"],
  ["tools"],
]

[[layers.cap]]
layer = "L3s"
max = "L2"
why = "Stage 1 2.1: storage and ML service internals depend only on L2 (and below; same-layer edges allowed)"

[[layers.exception]]
from-layer = "L1"
to = "hg-types"
why = "Stage 1 3.1's own Clock trait (L1) returns hg_types::Instant, while 2.1 lists hg-types in L2 contracts; the enterprise policy spec calls hg-types 'L1/L2'. The substrate needs the time types, so L1 may depend on hg-types until Stage 1 resolves the placement"

# --- Shipping binaries ------------------------------------------------------
[shipping]
binaries = "hg-*-main"
why = "Stage 1 2.1 L6: the shipping binaries are the hg-*-main packages"

# --- Q-CS-1 (Stage 1 8.1 M1 exit; coding standard Q-CS-1) ------------------
# Shipping hg-*-main binaries link only hg-substrate-os; only the
# simulation binaries run by hg-dst and hg-replay-main may link
# hg-substrate-sim. The distribution spec (217, 686) adds hg-launch-main
# and hg-updater-main to the OS-only list; every hg-*-main not listed
# below is OS-only already, so they need no entry.
# hg-dst-sim: M1 phase E split the simulation binaries (dst-sim,
# dst-smoke) out of hg-dst into this package (plan E-R1, C7); the hg-dst
# runner links no simulator.
[q-cs-1]
simulator = "hg-substrate-sim"
linkers = ["hg-replay-main", "hg-dst-sim"]
# The cryptographic-randomness trait: CryptoRandom in hg-substrate's code,
# CryptoRng in Stage 1 3.1's sketch; both names are checked.
crypto-traits = ["CryptoRandom", "CryptoRng"]
crypto-implementers = ["hg-substrate-os", "hg-substrate-sim"]
why = "a seeded Entropy::crypto() must not exist in a binary that touches the network"

# --- H-3 (JS-M0 heap design review): the object layout comes from the macro --
# `hg_heap::object!` is the only source of an `Object`/`Referent` impl: the
# layout it writes says which slots the collector traces, so a hand-written
# one that miscounts them makes the tracer read the wrong words. H-3 keeps
# the trait safe rather than unsafe precisely because the macro is the only
# author, and it says the rule is a lint, which this is. `hg-heap` itself
# writes the impls the macro expands to, and one for `Any`.
[h-3]
object-traits = ["Object", "Referent"]
object-authors = ["hg-heap"]
# `Object::LAYOUT_WITNESS` is the item a hand-written impl cannot leave
# out (E0046) and cannot write without naming one of these. Rules on the
# trait's own name are escapable -- a macro that takes the trait as an
# argument got past all three (10 November 2026) -- so H-3 owns these
# three names instead, which nothing else in the tree has a reason to
# use. Clippy carries `layout_witness` as well, where paths resolve.
witness-names = ["LayoutWitness", "layout_witness", "LAYOUT_WITNESS"]
why = "H-3: a hand-written layout can only make the tracer read the wrong slots, which is an in-cage wrong answer (H-2); the macro is what keeps it from happening at all"

# --- CS-AS-1 / G3 (A.6): ambient-effect crates only via the substrate -----
# Follows dev-dependencies too (G3 binds test targets); tier T crates are
# outside G3 and are neither checked nor looked through.
# --- G39 (layout spec 6.2): no floating point after the boundary -------------
# Layout's geometry is 32-bit fixed point at 1/64 CSS px, and every ratio is
# computed in i128 with one rounding, because DET-1 asks that the same page
# lay out identically on every ISA and floating point that a compiler may
# re-associate or contract does not promise that.
#
# The spec says the rule is a lint: "The boundary functions are the only
# place f32 or f64 appears in layout crates, and a lint rejects them
# anywhere else (G39)." This is that lint. It reads the *spelling* -- a
# primitive type and a float literal -- in the crates listed, with the
# boundary crate exempt.
#
# `crates` is the layout set as it exists; it grows with LY-M0 and LY-M1.
# The SVG geometry crates are deliberately absent: since the SVG spec's R6
# (20 October 2026) they follow the SVG spec's G122 -- its closed list of
# allowed binary64 operations -- instead of this rule, and meet layout only
# through hg-layout-num's rounding function.
[g39]
crates = ["hg-box-tree", "hg-fragment", "hg-layout", "hg-layout-num", "hg-paint-order"]
boundary = "hg-layout-num"
why = "DET-1 and FP-24: cross-ISA identity; the text stack's G28; the arithmetic CVE class"

[ambient]
crates = ["rand", "getrandom", "num_cpus", "tokio", "smol"]
via = ["hg-substrate-os"]
exempt = ["hg-lint-canary"]

# --- CS-ER-10 (A.6) ---------------------------------------------------------
[tier-t-only]
crates = ["anyhow"]

# --- CS-ST-2: procedural macros ---------------------------------------------
# No procedural macro is allowed yet; each addition is a reviewed decision.
[proc-macros]
allow = []
banned-in-layers = ["L1", "L2*", "L3*"]
banned-crates = ["syn"]

# --- CS-ST-1, CS-ST-14 (A.6) ------------------------------------------------
[layout]
dir = "crates"
prefix = "hg-"
version = "0.0.0"
exempt = ["xtask"]

# --- Stage 1 8.1a: "started", the M1 row's five M0 clauses -------------------
# M1's exit requires that ST-M0, TX-M0, LY-M0, GR-M0 and NW-M0 *start*.
# 8.1a defines starting as five clauses that turn on artefacts, so the
# clause is a CI result rather than a claim:
#   1 crates     every crate the M0 row names is a member with a tiers.toml row
#   2 generator  the crate the rest of the track generates from or builds on
#   3 oracle     the named job exists in .github/workflows/checks.yml
#   4 review     the design review is open with its agenda fixed
#   5 interlock  the cross-track obligations are recorded
# A row is checked only when `claimed = true`. An unclaimed track is
# reported by `hg-graph-lint --started` and never failed: the rule must
# not block the work that satisfies it. Setting `claimed` is a gate-file
# change (CS-GA-1), and it fails unless all five hold.
#
# The crates are the ones each M0 row names, which is a smaller set than
# the crates its milestone names in total: production crates such as
# hg-style and hg-layout belong to ST-M1 and LY-M1, not to the M0s.

[[started]]
track = "TX-M0"
spec = "reports/Izcal fonts and text.md"
claimed = true
crates = ["hg-ucd", "hg-unicode", "hg-unicode-build", "hg-fontgen", "hg-fontfmt", "hg-fontc"]
generator = "hg-fontgen"
oracle-job = "tx-1"
review = "research_notes/TX-M0 design review/README.md"
interlock = "measurements/milestones/m0-starts/README.md"
why = "TX-M0 leads: its own row puts normalization and the IDNA data first, by month 6, for hg-url at ST-M0, and TX-1 demands 100% of the Unicode conformance files from TX-M0, so the oracle is the exit criterion's own measure. hg-fontfmt is the reader TX-M0 names the proofs for; the first list left it out, which the 6.15 crate table corrects."

[[started]]
track = "ST-M0"
spec = "reports/Izcal HTML and CSS parsing and style.md"
claimed = true
crates = ["hg-htmlgen", "hg-html-syntax", "hg-html5lib", "hg-cssgen", "hg-css-props", "hg-style-reference", "hg-encoding", "hg-url"]
generator = "hg-htmlgen"
oracle-job = "html5lib"
review = "research_notes/ST-M0 design review/README.md"
interlock = "measurements/milestones/m0-starts/README.md"
why = "The .hgtok generator is the artefact the track generates from, on hg-opgen's pattern, and hg-html-syntax is where it generates to; the 6,827 html5lib tokenizer tests are the number the M0 row itself names."

[[started]]
track = "LY-M0"
spec = "reports/Izcal layout.md"
claimed = true
crates = ["hg-layout-num", "hg-box-tree", "hg-layout-reference", "hg-reftest-raster", "hg-wpt-layout", "hg-paint-order"]
generator = "hg-layout-num"
oracle-job = "wpt-layout"
review = "research_notes/LY-M0 design review/README.md"
interlock = "measurements/milestones/m0-starts/README.md"
why = "LY-M0's contract types rest on the computed-length numeric type, which ST-M0 must fix too (ST 6.9), so it is designed once. hg-types gains the geometry its tiers.toml row already reserves; it needs no row here, having one already."

[[started]]
track = "GR-M0"
spec = "reports/Izcal graphics and rendering.md"
claimed = false
crates = ["hg-gpu-hal", "hg-raster", "hg-raster-ref", "hg-display-list"]
generator = "hg-display-list"
oracle-job = "raster-ref"
review = "research_notes/GR-M0 design review/README.md"
interlock = "measurements/milestones/m0-starts/README.md"
why = "GR-M0 is the one M0 whose Needed by is another track's milestone (LY-M0), and hg-paint-order's contract is co-signed at LY-M0's review, which needs a named graphics owner. Its generator clause is met by the display-list, compositor-frame and canvas-command .hgidl formats through hg-ipc-codegen; the review document records what the rest waits for."

[[started]]
track = "NW-M0"
spec = "reports/Izcal networking.md"
claimed = false
crates = ["hg-net-wire", "hg-netsim", "hg-crypto", "hg-crypto-check", "hg-tls"]
generator = "hg-net-wire"
oracle-job = "wycheproof"
review = "research_notes/NW-M0 design review/README.md"
interlock = "measurements/milestones/m0-starts/README.md"
why = "NW-M0 is independent of the other four and has about twelve months of float, so it runs in parallel and never blocks them. hg-net-wire's Kani-proved kernels follow hg-ipc's pattern; hg-crypto joins [q-cs-1] crypto-implementers when it lands."

# --- Stage 1 2.2: G1, G2, G4, G6, G7, G8 -------------------------------------
# G3 is clippy.toml's plus [ambient] above; G5 is built in (it reads
# unsafe-inventory.toml); G9 is hg-anchor's.

[[forbid]]
rule = "G1"
from = ["hg-style", "hg-selectors", "hg-box-tree", "hg-layout", "hg-layout-num", "hg-layout-math", "hg-scroll", "hg-svg-layout", "hg-fragment", "hg-hit"]
reach = "direct"
crates = ["hg-dom", "hg-script-api", "hg-bindings", "hg-heap", "hg-js-*"]
why = "G1: style and layout read the DOM only through hg-tree-traits; they never name the DOM, bindings, heap or engine"

[[forbid]]
rule = "G1"
from = ["hg-paint"]
reach = "direct"
crates = ["hg-dom", "hg-script-api", "hg-bindings", "hg-heap", "hg-js-*", "hg-node-store", "hg-style", "hg-box-tree", "hg-layout"]
why = "G1: hg-paint reads hg-fragment, hg-scroll and hg-tree-traits only, never the DOM, style or the layout engine"

[[disjoint]]
rule = "G2"
a = ["hg-node-store", "hg-dom"]
b = ["hg-projection"]
allow = ["hg-tree-traits", "hg-types"]
why = "G2: the projection and the DOM share no project-local code but hg-tree-traits and hg-types"

[[forbid]]
rule = "G4"
features = "default"
from = ["hg-*-main"]
from-except = ["hg-ml-main"]
crates = ["hg-agent*", "hg-ml*"]
why = "G4 (AG-0): off means not loaded; no default-feature main links agent or ML crates"

[[forbid]]
rule = "G4"
features = "default"
from = ["hg-ml-main"]
crates = ["hg-agent*"]
why = "G4: hg-ml-main may link hg-ml*, never hg-agent*, with default features"

[[forbid]]
rule = "G6"
from = ["hg-dom", "hg-bindings", "hg-script"]
reach = "direct"
crates = ["hg-heap", "hg-js-*"]
except = ["hg-js-host"]
why = "G6: the DOM, bindings and script reach the engine only through hg-js-host's handles"

# G7 lists hg-net*, hg-media* and hg-pdf-* as well. Those globs also match
# crates Stage 1 2.1 places on the renderer side or in pure layers
# (hg-media, hg-media-host and hg-media-os in L4; hg-net-wire in L2s;
# hg-net-replay in the replay binary; the L2d PDF parsers), so encoding
# them would fail the moment those crates exist. They wait for G7 to name
# the service internals exactly.
[[forbid]]
rule = "G7"
from = ["hg-renderer-main", "hg-renderer-jitless-main"]
crates = ["hg-storage", "hg-gpu", "hg-audio-service", "hg-capture-service", "hg-device-service", "hg-font-service", "hg-ml-service"]
why = "G7 (I-2): renderer-side crates reach services only through their generated IPC endpoints"

[[direct-only]]
rule = "G8"
crates = ["hg-semantic-repair"]
allow = ["hg-tree-traits", "hg-semantic-model"]
why = "G8 (B8): hg-semantic-repair depends only on hg-tree-traits and the semantic tree's read interface (hg-semantic-model, Stage 1 2.1 L2)"

# --- OS integration (FI-4) G230-G232 ----------------------------------------
[[forbid]]
rule = "G230"
from = ["hg-renderer-main", "hg-renderer-jitless-main"]
crates = ["hg-os-broker", "hg-os-service"]
why = "G230: no renderer links the OS-integration broker or service"

[[direct-only]]
rule = "G231/G255"
crates = ["hg-launch-main"]
allow = ["hg-substrate-os", "hg-install", "hg-launch-wire", "hg-xdg", "hg-os-journal"]
why = "G231 and G255 (aligned): the launcher links only the substrate's launch entry, hg-install, hg-launch-wire, hg-xdg and hg-os-journal"

[[forbid]]
rule = "G231"
from = ["hg-launch-main"]
crates = ["hg-ipc", "hg-substrate-sim"]
layers = ["L2e", "L3", "L4"]
why = "G231: the launcher links no engine crate, no hg-ipc and no simulator"

[[direct-only]]
rule = "G232"
crates = ["hg-launch-wire", "hg-dbus", "hg-xdg", "hg-os-journal"]
allow = []
tier = "P"
no-std = true
why = "G232: tier P, no dependencies outside core and alloc"

# --- Enterprise policy (FI-3) G241 ------------------------------------------
# G248 confines hg-substrate-os::policy, a module, so it is below crate
# granularity and waits for a module-level check.
[[only-linked-by]]
rule = "G241"
crates = ["hg-policy-format"]
binaries = ["hg-os-adapter-main"]
direct-dependents = ["hg-policy-adapter"]
why = "G241 (IPC-R15): the policy parser runs only in the sandboxed OS adapter, through hg-policy-adapter"

# --- Distribution and updates (FI-2) G252 -----------------------------------
# G251's broker-only launch API for non-Izcal programs is an API inside
# hg-substrate-os, so it is below crate granularity too. G252's "every
# update-metadata parser" joins `crates` as each parser crate is named.
[[only-linked-by]]
rule = "G252"
crates = ["hg-delta"]
binaries = ["hg-updater-main"]
why = "G252 (UPD-R2): update payloads are parsed only in the updater"

# --- Compliance (FI-1) G260 -------------------------------------------------
[[forbid]]
rule = "G260"
from = ["hg-*-main"]
crates = ["hg-advisory", "hg-sbom", "hg-conformity", "hg-acr"]
why = "G260: compliance tools never ship"
