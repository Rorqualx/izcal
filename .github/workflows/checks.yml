# Runs tools/checks.sh on every pull request and push to main: the same
# checks as the git hooks, so a commit made with --no-verify is still
# caught. Branch protection requires this job ("checks"). The AI review runs
# only in the pre-commit hook (it needs the Claude Code CLI and an account).

name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit hashes, so a moved tag cannot
      # change what runs (the 2025 tj-actions compromise worked that way).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks, actionlint, zizmor and cargo-deny, each pinned and checked
      # against its SHA-256 (tools/ci-install-tools.sh). shellcheck, python3
      # and rustfmt (stable) come with the runner image.
      - name: Install check tools
        run: |
          bash tools/ci-install-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          shellcheck --version | sed -n 2p; rustfmt --version

      - name: Checks
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=$PR_BASE
          [ "$EVENT" = pull_request ] || base=$PUSH_BEFORE
          tools/checks.sh --range "$base" "$GITHUB_SHA"
