# Runs tools/checks.sh (including the `graph` crate-graph lint), clippy,
# the tests and the Kani proofs on every pull request and push to main:
# the same checks as the git hooks, so a commit made with --no-verify is
# still caught. Branch protection requires this job ("checks"). The AI
# review runs only in the pre-commit hook (it needs the Claude Code CLI and
# an account).

name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit hashes, so a moved tag cannot
      # change what runs (the 2025 tj-actions compromise worked that way).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks, actionlint, zizmor, cargo-deny and ast-grep, each pinned and checked
      # against its SHA-256 (tools/ci-install-tools.sh). shellcheck, python3
      # and rustfmt (stable) come with the runner image; the repo's
      # rust-toolchain.toml pins 1.99.1 (CS-ST-9) with clippy and rustfmt,
      # which rustup installs on first use; the add below is a no-op then.
      - name: Install check tools
        run: |
          bash tools/ci-install-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          rustup component add rustfmt || true
          shellcheck --version | sed -n 2p; rustfmt --version

      - name: Checks
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=$PR_BASE
          [ "$EVENT" = pull_request ] || base=$PUSH_BEFORE
          tools/checks.sh --range "$base" "$GITHUB_SHA"

      # The graph lint's own tests, with the pinned ast-grep required, so
      # its code-level checks (G5's crate roots and inventory, Q-CS-1's
      # crypto check) are tested here; the test jobs below skip them
      # where ast-grep is not installed. tools/checks.sh above runs the
      # lint itself on every push and pull request (the `graph` check).
      - name: Graph lint tests
        env:
          IZCAL_REQUIRE_AST_GREP: "1"
        run: cargo test -p hg-graph-lint --locked

  # Clippy with -D warnings on all three reference OSes: the substrate's
  # sandbox backends are cfg-gated per OS, so a lint error in one backend
  # only shows when compiling for that OS.
  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      # rust-toolchain.toml lists clippy; this only makes the install visible.
      - name: Install clippy
        run: rustup component add clippy

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The workspace tests on all three reference OSes (CS-TE-2): the OS
  # substrate's own tests, the simulator's medium tests, and hg-dst
  # driving the dst-smoke simulation binary, including a same-seed
  # rerun check (CS-T5).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      - name: Test
        run: cargo test --workspace --locked

  # JS spec 6.5 step 8 and JS-14: the heap's inventoried unsafe code runs
  # under Miri, with the moving test collector (it moves every object on
  # every allocation). Miri needs a nightly; this one is pinned.
  miri:
    runs-on: ubuntu-24.04
    # 25 min on an M-series Mac for hg-heap's 14 tests (31 Oct 2026).
    # The heap verifier (Phase 2 item 4) now runs after every cycle in
    # debug builds, which this job is. Measured cost on an M-series Mac,
    # 9 Nov 2026, on the heaviest test (every collector mode, all three):
    # 492.5 s with it against 388.2 s without, so +27%.
    #
    # The budget was 60 minutes. Over the twelve runs before this change
    # the job took 30.9 to 54.9 minutes, median 43.8: a 24-minute spread
    # on the same suite, with the worst run at 92% of the cap. The
    # spread is what made 60 unsafe, not the suite's size -- a slow
    # runner would have failed the job while saying nothing about the
    # code. JS-10 (c)'s corruption harness adds
    # three, measured on a Linux x86_64 host on 10 Nov 2026 at 106 s —
    # the fuzzer 50.4 s, two agent heaps on two threads 36.7 s, the
    # trusted index 18.5 s — with its fourth case ignored under Miri,
    # because a bound over cage data is not an unsafe-code or a
    # concurrency property and Miri adds nothing to it. That 106 s is
    # the harness after it was sized for Miri; as first written it
    # measured 3,109 s on the same host, which no budget here would
    # have absorbed.
    #
    # 80 minutes leaves room for the next few. Raise it again rather
    # than thin out what Miri sees: this job is where the heap's unsafe
    # core and its races are checked.
    timeout-minutes: 80
    env:
      MIRI_TOOLCHAIN: nightly-2026-10-17
      MIRIFLAGS: -Zmiri-permissive-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      - name: Install Miri
        run: rustup toolchain install "$MIRI_TOOLCHAIN" --profile minimal --component miri,rust-src

      - name: Miri
        run: cargo +"$MIRI_TOOLCHAIN" miri test -p hg-heap --lib --locked

  # ORC-1 (JS-M0 plan, Phase 1): every core operation of the reference
  # interpreter on 74 edge operands (99,308 cases), checked against
  # engine262 run black-box under Node. engine262 is the pinned npm
  # package in tools/test-data.toml, fetched with its SHA-256 checked;
  # it is test-only, never linked or shipped. 8 s on the Mac with 6 jobs
  # (31 Oct 2026).
  js-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      - name: Fetch engine262
        run: tools/fetch-test-data.sh engine262

      - name: Operation-level oracle
        run: |
          commit=$(awk '/^\[engine262\]$/ { t = 1; next } /^\[/ { t = 0 } t && $1 == "commit" { gsub(/"/, "", $3); print $3 }' tools/test-data.toml)
          cargo run --release --locked -p hg-js-oracle -- ops --engine262 "$HOME/.cache/izcal/test-data/engine262-$commit"

  # VER-1 (Stage 1 4.1; security scope 6.6): every Kani harness in the
  # IPC crates, through tools/kani.sh, which also fails on a cover no
  # input reaches. Kani 0.68.0 is pinned and its bundle checked against
  # a SHA-256 (tools/ci-install-kani.sh). Measured on hueyj: 28 harnesses
  # in 8.7 min, peak 4.1 GB on one harness (the runner has 16 GB). With
  # hg-os-types (130 of its harnesses took 50 min on hueyj, peak 6.9 GiB)
  # and hg-launch-wire (7, about 5 min) the job needs longer.
  kani:
    runs-on: ubuntu-24.04
    # One job per package, because the binding constraint is memory, not
    # cores. Measured on the 9 November run of main (job 129337943104):
    # 433 harnesses, 8,444 s of verification in a 9,018 s job, so solving
    # is 94% of it and codegen under 10 min; and a single `cbmc` peaked at
    # 8,772 MB with 5,508 MB left on this runner. Two heavy harnesses in
    # one 16 GB job would race for the last gigabyte, which is how a CBMC
    # run once pressed hueyj's user slice until systemd-oomd killed the
    # login manager (30 Oct 2026, see tools/kani.sh). A package per job
    # gives each its own 16 GB and parallelises by the only axis that
    # cannot run them out of memory. Wall clock becomes the slowest
    # package instead of their sum.
    #
    # `fail-fast: false` so one failing package still reports the others:
    # a proof that fails is a finding, and the rest are evidence.
    strategy:
      fail-fast: false
      matrix:
        # Kept in step with tools/kani.sh's default list.
        pkg:
          - hg-ipc
          - hg-ipc-gen
          - hg-os-types
          - hg-launch-wire
          - hg-launch-plan
          - hg-substrate-os
          - hg-heap
    name: kani (${{ matrix.pkg }})
    # The largest package measured about 65 min of the 141 above, and the
    # set grows by phase, so this leaves room without the old 360.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      - name: Install Kani
        run: bash tools/ci-install-kani.sh

      - name: Kani
        # Logs memory, swap and free disk once a minute. On 30 Oct 2026 the
        # runner was shut down mid-run three times with no reason in the
        # log, so a shutdown now leaves the runner's last state behind.
        run: |
          while sleep 60; do
            echo "runner: $(free -m | awk '/^Mem:/{printf "mem_used=%sM avail=%sM", $3, $7} /^Swap:/{printf " swap_used=%sM", $3}') disk_avail=$(df -BM --output=avail / | tail -1 | tr -d ' ') top=$(ps -eo rss=,comm= --sort=-rss | head -1 | awk '{printf "%s:%dM", $2, $1/1024}')"
          done &
          mon=$!
          trap 'kill "$mon"' EXIT
          KANI_PACKAGES='${{ matrix.pkg }}' tools/kani.sh
