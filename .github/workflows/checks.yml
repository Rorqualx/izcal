# Runs tools/checks.sh (including the `graph` crate-graph lint), clippy,
# the tests and the Kani proofs on every pull request and push to main:
# the same checks as the git hooks, so a commit made with --no-verify is
# still caught. Branch protection requires this job ("checks"). The AI
# review runs only in the pre-commit hook (it needs the Claude Code CLI and
# an account).

name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit hashes, so a moved tag cannot
      # change what runs (the 2025 tj-actions compromise worked that way).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks, actionlint, zizmor, cargo-deny and ast-grep, each pinned and checked
      # against its SHA-256 (tools/ci-install-tools.sh). shellcheck, python3
      # and rustfmt (stable) come with the runner image; the repo's
      # rust-toolchain.toml pins 1.99.1 (CS-ST-9) with clippy and rustfmt,
      # which rustup installs on first use; the add below is a no-op then.
      - name: Install check tools
        run: |
          bash tools/ci-install-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          rustup component add rustfmt || true
          shellcheck --version | sed -n 2p; rustfmt --version

      - name: Checks
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=$PR_BASE
          [ "$EVENT" = pull_request ] || base=$PUSH_BEFORE
          tools/checks.sh --range "$base" "$GITHUB_SHA"

      # The graph lint's own tests, with the pinned ast-grep required, so
      # its code-level checks (G5's crate roots and inventory, Q-CS-1's
      # crypto check) are tested here; the test jobs below skip them
      # where ast-grep is not installed. tools/checks.sh above runs the
      # lint itself on every push and pull request (the `graph` check).
      - name: Graph lint tests
        env:
          IZCAL_REQUIRE_AST_GREP: "1"
        run: cargo test -p hg-graph-lint --locked

  # Clippy with -D warnings on all three reference OSes: the substrate's
  # sandbox backends are cfg-gated per OS, so a lint error in one backend
  # only shows when compiling for that OS.
  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      # rust-toolchain.toml lists clippy; this only makes the install visible.
      - name: Install clippy
        run: rustup component add clippy

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The workspace tests on all three reference OSes (CS-TE-2): the OS
  # substrate's own tests, the simulator's medium tests, and hg-dst
  # driving the dst-smoke simulation binary, including a same-seed
  # rerun check (CS-T5).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      - name: Test
        run: cargo test --workspace --locked

  # JS spec 6.5 step 8 and JS-14: the heap's inventoried unsafe code runs
  # under Miri, with the moving test collector (it moves every object on
  # every allocation). Miri needs a nightly; this one is pinned.
  miri:
    runs-on: ubuntu-24.04
    # 25 min on an M-series Mac for hg-heap's 14 tests (31 Oct 2026).
    # The heap verifier (Phase 2 item 4) now runs after every cycle in
    # debug builds, which this job is. Measured cost on an M-series Mac,
    # 9 Nov 2026, on the heaviest test (every collector mode, all three):
    # 492.5 s with it against 388.2 s without, so +27%.
    #
    # The budget was 60 minutes. Over the twelve runs before this change
    # the job took 30.9 to 54.9 minutes, median 43.8: a 24-minute spread
    # on the same suite, with the worst run at 92% of the cap. The
    # spread is what made 60 unsafe, not the suite's size -- a slow
    # runner would have failed the job while saying nothing about the
    # code. JS-10 (c)'s corruption harness adds
    # three, measured on a Linux x86_64 host on 10 Nov 2026 at 106 s —
    # the fuzzer 50.4 s, two agent heaps on two threads 36.7 s, the
    # trusted index 18.5 s — with its fourth case ignored under Miri,
    # because a bound over cage data is not an unsafe-code or a
    # concurrency property and Miri adds nothing to it. That 106 s is
    # the harness after it was sized for Miri; as first written it
    # measured 3,109 s on the same host, which no budget here would
    # have absorbed.
    #
    # 80 minutes leaves room for the next few. Raise it again rather
    # than thin out what Miri sees: this job is where the heap's unsafe
    # core and its races are checked.
    timeout-minutes: 80
    env:
      MIRI_TOOLCHAIN: nightly-2026-10-17
      MIRIFLAGS: -Zmiri-permissive-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      - name: Install Miri
        run: rustup toolchain install "$MIRI_TOOLCHAIN" --profile minimal --component miri,rust-src

      - name: Miri
        run: cargo +"$MIRI_TOOLCHAIN" miri test -p hg-heap --lib --locked

  # ORC-1 (JS-M0 plan, Phase 1): every core operation of the reference
  # interpreter on 74 edge operands (99,308 cases), checked against
  # engine262 run black-box under Node. engine262 is the pinned npm
  # package in tools/test-data.toml, fetched with its SHA-256 checked;
  # it is test-only, never linked or shipped. 8 s on the Mac with 6 jobs
  # (31 Oct 2026).
  js-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      - name: Fetch engine262
        run: tools/fetch-test-data.sh engine262

      - name: Operation-level oracle
        run: |
          commit=$(awk '/^\[engine262\]$/ { t = 1; next } /^\[/ { t = 0 } t && $1 == "commit" { gsub(/"/, "", $3); print $3 }' tools/test-data.toml)
          cargo run --release --locked -p hg-js-oracle -- ops --engine262 "$HOME/.cache/izcal/test-data/engine262-$commit"

  # ORC-1 (JS-M0 plan, Phase 1): the WebAssembly specification's own
  # test suite, read by hg-wast. The pinned spec tree (tools/
  # test-data.toml, SHA-256 checked) holds 259 `.wast` files; every one
  # must parse, and every module span in them must parse again on its
  # own -- 7,200 of them -- because a span is what an engine would be
  # handed. 0.7 s on the Mac (11 Nov 2026).
  #
  # The floors are the counts the pinned suite is known to hold. They
  # are not decoration: a reader that quietly stopped recognising a
  # command would still parse all 259 files and still report success,
  # and only the census would show it. A pin moves in its own commit,
  # which is where these numbers move with it.
  #
  # What this job does not yet do is run the scripts. The engine
  # adapter, and the differential against the reference interpreter
  # that validates the runner the way engine262 validates hg-test262,
  # need an OCaml toolchain and follow separately.
  wast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      - name: Fetch the WebAssembly specification suite
        run: tools/fetch-test-data.sh wasm-spec

      - name: Read every script in the suite
        run: |
          commit=$(awk '/^\[wasm-spec\]$/ { t = 1; next } /^\[/ { t = 0 } t && $1 == "commit" { gsub(/"/, "", $3); print $3 }' tools/test-data.toml)
          cargo run --release --locked -p hg-wast -- parse \
            --suite "$HOME/.cache/izcal/test-data/wasm-spec-$commit/test/core" \
            --quiet --verify \
            --floor assert_return=52748 \
            --floor assert_trap=4984 \
            --floor assert_invalid=2732 \
            --floor module=2269 \
            --floor assert_malformed=1945 \
            --floor invoke=359 \
            --floor assert_unlinkable=200 \
            --floor register=80 \
            --floor assert_exception=18 \
            --floor assert_exhaustion=15 \
            --floor "module instance=3"

  # TX-1's normalization half (fonts and text spec 9.2, TX-M0).
  #
  # TX-1 is a ship blocker: 100% of the Unicode conformance files at the
  # pinned version, from TX-M0, and "a Unicode upgrade does not land
  # until 100%". This job runs the half that exists today --
  # NormalizationTest.txt, and the invariance condition over every code
  # point the file does not list -- and the freshness check on the
  # tables hg-unicode-build generates. The other seven files arrive with
  # bidi, line breaking and segmentation.
  #
  # IZCAL_REQUIRE_UNICODE_DATA=1 turns the tests' "not fetched, skipped"
  # path into a failure, so the oracle cannot be silently skipped here;
  # the same tests run under `cargo test --workspace` on three OSes,
  # where the database is not fetched and they say so instead.
  #
  # The database is pinned by SHA-256 in tools/test-data.toml, never
  # committed and never linked. The tables derived from it are standards
  # data and do ship.
  tx-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      - name: Fetch the Unicode Character Database
        run: tools/fetch-test-data.sh unicode-ucd unicode-idna-mapping unicode-idna-test unicode-emoji-test

      - name: The generated tables are fresh
        env:
          IZCAL_REQUIRE_UNICODE_DATA: "1"
        run: cargo run --locked -p hg-unicode-build -- check

      # TX-1 names nine conformance files; two of them run here.
      # NormalizationTest measures the normalization half and
      # IdnaTestV2 the UTS #46 half, which hg-url's host parsing is
      # built on (style spec 6.2, ST-M0).
      - name: TX-1, normalization and IdnaTestV2
        env:
          IZCAL_REQUIRE_UNICODE_DATA: "1"
        run: |
          cargo test --release --locked -p hg-unicode-build --test it -- --nocapture
          cargo test --release --locked -p hg-unicode --test it

  # ST-1's tokenizer half (style spec 9.1): the html5lib tokenizer
  # suite, run against both of hg-htmlgen's generated back ends, with
  # the measured pass count held against hg-html5lib::BASELINE so it can
  # only go up. The entity table the tokenizer ships is generated from
  # WHATWG's pinned entities.json, and is checked fresh here too,
  # because nothing else in CI has that file.
  html5lib:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      - name: Fetch html5lib-tests and the named character references
        run: tools/fetch-test-data.sh html5lib html-entities

      - name: The generated tokenizer is fresh
        run: cargo run --locked -p hg-htmlgen -- check

      - name: ST-1, the tokenizer suite
        env:
          IZCAL_REQUIRE_HTML_DATA: "1"
        run: |
          cargo run --release --locked -p hg-html5lib
          cargo test --release --locked -p hg-html5lib --test it -- --nocapture

      # ST-D16: the other half of the same suite, over HTML's
      # "determine the character encoding" and hg-encoding's sniffing
      # helpers. The 1,024-byte prescan window is a decision, and the
      # runner prints what every other window would score beside it.
      - name: ST-D16, the encoding suite
        env:
          IZCAL_REQUIRE_HTML_DATA: "1"
        run: cargo run --release --locked -p hg-html5lib -- --suite encoding

  # ST-D16 (style spec 6.6): the Encoding Standard, from the
  # standard's own published data. The tables hg-encoding ships are
  # generated from encodings.json and indexes.json, so this job checks
  # them fresh against the pin and then runs the decoders and encoders
  # over every byte sequence the indexes define, in both directions.
  encoding:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      - name: Fetch the Encoding Standard's data
        run: tools/fetch-test-data.sh encoding-encodings encoding-indexes

      - name: The generated tables are fresh
        env:
          IZCAL_REQUIRE_ENCODING_DATA: "1"
        run: cargo run --locked -p hg-encoding-build -- check

      - name: Every index entry, decoded and re-encoded
        env:
          IZCAL_REQUIRE_ENCODING_DATA: "1"
        run: |
          cargo test --release --locked -p hg-encoding-build --test it -- --nocapture
          cargo test --release --locked -p hg-encoding --test it -- --nocapture

  # LY-M0's foundations: the geometry, the numeric boundary, the
  # fragment store and the layout contract.
  #
  # There is no layout engine yet, so what this job checks is the
  # contract itself — the types every formatting context will be
  # written against, and the two rules that keep them honest: G39
  # (no floating point after the boundary) and G45 (a fragment handle
  # beyond a pass carries an epoch).
  layout-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      - name: The layout unit and Writing Modes 4's mappings
        run: cargo test --release --locked -p hg-types --test it -- --nocapture

      - name: The numeric boundary (G39)
        run: cargo test --release --locked -p hg-layout-num --test it -- --nocapture

      - name: The fragment store (LY-D18, G45)
        run: cargo test --release --locked -p hg-fragment --test it -- --nocapture

      - name: The layout contract and its central diff (LY-D1)
        run: cargo test --release --locked -p hg-layout --test it -- --nocapture

      - name: The box tree (LY-D2)
        run: cargo test --release --locked -p hg-box-tree --features testing --test it -- --nocapture

      - name: The reference layout engine (LY-D5, G41)
        run: cargo test --release --locked -p hg-layout-reference --features testing --test it -- --nocapture

      - name: The reftest rasterizer and Appendix E's paint order
        run: |
          cargo test --release --locked -p hg-reftest-raster --test it -- --nocapture
          cargo test --release --locked -p hg-paint-order --test it -- --nocapture

      - name: Fetch WPT's css/CSS2 suite
        run: tools/fetch-test-data.sh wpt-css2

      - name: LY-M0, what the suite needs and what we can run
        run: |
          cargo run --release --locked -p hg-wpt-layout -- --chapters
          cargo test --release --locked -p hg-wpt-layout --test it -- --nocapture

  # ST-D12 and G20: the reference style engine. It shares no code with
  # the production engine -- its own CSS Syntax 3 tokenizer, its own
  # Selectors 3 matcher, its own cascade -- which is what makes ST-4
  # and ST-6, both ship blockers, mean anything.
  #
  # There is no differential to run yet, because hg-style does not
  # exist. What this job checks is the oracle itself: a reference
  # engine that is quietly wrong makes every later differential green
  # and hides the bug it was built to find.
  style-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      - name: The DOM view every reader shares (G1)
        run: cargo test --release --locked -p hg-tree-traits --features testing --test it -- --nocapture

      - name: Selectors 3, the cascade and the Syntax 3 tokenizer
        run: cargo test --release --locked -p hg-style-reference --features testing --test it -- --nocapture

  # G31, the browser's one URL parser. WPT's url/ suite is the oracle:
  # 904 cases of input, base and the eight serialized components a
  # conforming parser must produce -- or `failure: true`, which is
  # three-tenths of the suite and the part a parser that merely tries
  # hard would get wrong.
  #
  # The suite is test-only (BSD-3-Clause, OD-L2), fetched at a pinned
  # commit with a SHA-256 check and never committed. Two smaller files
  # go with it: toascii.json, which is the domain parser alone, and
  # percent-encoding.json, which is the one place a legacy encoding
  # reaches a URL.
  url:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      - name: Fetch WPT's url resources
        run: tools/fetch-test-data.sh wpt-urltestdata wpt-toascii wpt-percent-encoding

      - name: ST-M0, the WPT url suite
        run: cargo run --release --locked -p hg-wpt-url -- --suite all

      - name: hg-url's own tests
        run: cargo test --release --locked -p hg-url --test it -- --nocapture

  # ST-D6 (style spec 6.6): the property table is generated from
  # @webref/css plus Izcal's .hgprop overlay, and the overlay restates
  # the webref fields the engine was written against. This job is where
  # that restatement earns its keep -- it fails when the two disagree,
  # so a specification change arrives as a named difference rather than
  # as silent drift (ST-7).
  #
  # And then a disagreement is planted in each field in turn, and the
  # check is required to *refuse* it, against the twin that has no
  # plant and must pass. Without that, a cross-check that compared
  # nothing would pass this job while testing nothing.
  cssgen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      - name: Fetch the pinned @webref/css
        run: tools/fetch-test-data.sh webref-css

      - name: ST-D6, the overlay against the pinned webref
        env:
          IZCAL_REQUIRE_CSS_DATA: "1"
        run: |
          cargo run --locked -p hg-cssgen -- report
          cargo run --locked -p hg-cssgen -- check

      - name: The planted disagreements, and their twins
        env:
          IZCAL_REQUIRE_CSS_DATA: "1"
        run: |
          cargo test --release --locked -p hg-cssgen --test it -- --nocapture
          cargo test --release --locked -p hg-css-props --all-features

  # ORC-1 (JS-M0 plan, Phase 1), the other half: the differential.
  #
  # `wast` above shows that every script parses. That is not the same as
  # reading them correctly, and no amount of parsing will say which. So
  # here each script is parsed, written back out from what was parsed,
  # and run through the WebAssembly reference interpreter -- which must
  # reach the same verdict on the rendering as on the original. A
  # misread value does not survive that trip.
  #
  # And then one value each script expects is changed on purpose, and
  # the interpreter is required to *refuse* the result. Without it, a
  # renderer that wrote vacuous assertions, or dropped them, would agree
  # with the original just as well and this job would pass while testing
  # nothing.
  #
  # The interpreter is built from the same pinned tree, black-box: it is
  # never linked, never vendored, and its source is never read (M-1 part
  # 3). Its own files declare ocaml >= 4.14, dune >= 2.9 and
  # menhir >= 20220210; noble has 4.14.1, 3.14.0 and 20231231. Measured
  # on macOS with OCaml 5.5.2: 259 files in 17 s.
  wast-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      - name: Install the OCaml toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ocaml ocaml-dune menhir
          ocaml -version && dune --version && menhir --version

      - name: Fetch the WebAssembly specification suite
        run: tools/fetch-test-data.sh wasm-spec

      - name: Build the reference interpreter
        run: |
          commit=$(awk '/^\[wasm-spec\]$/ { t = 1; next } /^\[/ { t = 0 } t && $1 == "commit" { gsub(/"/, "", $3); print $3 }' tools/test-data.toml)
          make -C "$HOME/.cache/izcal/test-data/wasm-spec-$commit/interpreter"

      - name: The rendering, and one deliberate error per script
        run: |
          commit=$(awk '/^\[wasm-spec\]$/ { t = 1; next } /^\[/ { t = 0 } t && $1 == "commit" { gsub(/"/, "", $3); print $3 }' tools/test-data.toml)
          tree="$HOME/.cache/izcal/test-data/wasm-spec-$commit"
          cargo run --release --locked -p hg-wast -- check \
            --suite "$tree/test/core" \
            --engine "$tree/interpreter/wasm" \
            --out "$RUNNER_TEMP/rendered" \
            --quiet --mutate

  # VER-1 (Stage 1 4.1; security scope 6.6): every Kani harness in the
  # IPC crates, through tools/kani.sh, which also fails on a cover no
  # input reaches. Kani 0.68.0 is pinned and its bundle checked against
  # a SHA-256 (tools/ci-install-kani.sh). Measured on hueyj: 28 harnesses
  # in 8.7 min, peak 4.1 GB on one harness (the runner has 16 GB). With
  # hg-os-types (130 of its harnesses took 50 min on hueyj, peak 6.9 GiB)
  # and hg-launch-wire (7, about 5 min) the job needs longer.
  kani:
    runs-on: ubuntu-24.04
    # One job per package, because the binding constraint is memory, not
    # cores. Measured on the 9 November run of main (job 129337943104):
    # 433 harnesses, 8,444 s of verification in a 9,018 s job, so solving
    # is 94% of it and codegen under 10 min; and a single `cbmc` peaked at
    # 8,772 MB with 5,508 MB left on this runner. Two heavy harnesses in
    # one 16 GB job would race for the last gigabyte, which is how a CBMC
    # run once pressed hueyj's user slice until systemd-oomd killed the
    # login manager (30 Oct 2026, see tools/kani.sh). A package per job
    # gives each its own 16 GB and parallelises by the only axis that
    # cannot run them out of memory. Wall clock becomes the slowest
    # package instead of their sum.
    #
    # `fail-fast: false` so one failing package still reports the others:
    # a proof that fails is a finding, and the rest are evidence.
    strategy:
      fail-fast: false
      matrix:
        # Kept in step with tools/kani.sh's default list.
        pkg:
          - hg-ipc
          - hg-ipc-gen
          - hg-os-types
          - hg-launch-wire
          - hg-launch-plan
          - hg-substrate-os
          - hg-heap
          - hg-fontfmt
    name: kani (${{ matrix.pkg }})
    # The largest package measured about 65 min of the 141 above, and the
    # set grows by phase, so this leaves room without the old 360.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      - name: Install Kani
        run: bash tools/ci-install-kani.sh

      - name: Kani
        # Logs memory, swap and free disk once a minute. On 30 Oct 2026 the
        # runner was shut down mid-run three times with no reason in the
        # log, so a shutdown now leaves the runner's last state behind.
        run: |
          while sleep 60; do
            echo "runner: $(free -m | awk '/^Mem:/{printf "mem_used=%sM avail=%sM", $3, $7} /^Swap:/{printf " swap_used=%sM", $3}') disk_avail=$(df -BM --output=avail / | tail -1 | tr -d ' ') top=$(ps -eo rss=,comm= --sort=-rss | head -1 | awk '{printf "%s:%dM", $2, $1/1024}')"
          done &
          mon=$!
          trap 'kill "$mon"' EXIT
          KANI_PACKAGES='${{ matrix.pkg }}' tools/kani.sh
